version: '3'

services:
  nextcloud_db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --transaction-isolation=READ-COMMITTED
      - --binlog-format=ROW
      - --skip-name-resolve
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --innodb-buffer-pool-size=1G
      - --innodb-flush-log-at-trx-commit=2
    volumes:
      - nextcloud_mariadb:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=${NEXTCLOUD_MYSQL_ROOT_PASSWORD:-SUBFAIL}
      - MARIADB_PASSWORD=${NEXTCLOUD_MYSQL_ROOT_PASSWORD:-SUBFAIL}
      - MARIADB_DATABASE=nextcloud
      - MARIADB_USER=${NEXTCLOUD_MYSQL_USER:-SUBFAIL}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nextcloud_back
    labels:
      - "container_group=nextcloud"


  nextcloud:
    image: nextcloud:35-apache
    expose:
      - 80
    depends_on:
      nextcloud_db:
        condition: service_healthy  
    volumes:
      - nextcloud_config:/var/www/html/config
      - nextcloud_data:/var/www/html/data
      - nextcloud_apps:/var/www/html/custom_apps
      - nextcloud_music:/mnt/music:ro
      - nextcloud_video:/mnt/video:ro
      - nextcloud_camelot:/mnt/camelot:ro
      - nextcloud_scratch:/mnt/scratch
      - nextcloud_books:/mnt/books:ro
    restart: unless-stopped
    networks:
      - reverse-proxy
      - nextcloud_back
      - smtp
    environment:
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${NEXTCLOUD_MYSQL_USER:-SUBFAIL}
      - MYSQL_PASSWORD=${NEXTCLOUD_MYSQL_PASSWORD:-SUBFAIL}
      - MYSQL_HOST=nextcloud_db

    labels:
      - "container_group=nextcloud"
      - "traefik.enable=true"
      - "traefik.docker.network=reverse-proxy" #needed if there are multiple networks attached to this container
      - "traefik.http.routers.nextcloud.tls.certresolver=myresolver"
      - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.${DNS_SUFFIX:-local}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.middlewares=middlewares-bypassauth"         


volumes:
  nextcloud_config:
    driver: "local"
    driver_opts:
      device: "${VOL_DEVICE_PREFIX_SSD:-SUBFAIL}/containers/nextcloud/config"
      type: ${VOL_TYPE:-SUBFAIL}
      o: ${VOL_OPS:-SUBFAIL}
  nextcloud_data:
    driver: "local"
    driver_opts:
      device: "${VOL_DEVICE_PREFIX_SSD:-SUBFAIL}/containers/nextcloud/data"
      type: ${VOL_TYPE:-SUBFAIL}
      o: ${VOL_OPS:-SUBFAIL}
  nextcloud_apps:
    driver: "local"
    driver_opts:
      device: "${VOL_DEVICE_PREFIX_SSD:-SUBFAIL}/containers/nextcloud/custom_apps"
      type: ${VOL_TYPE:-SUBFAIL}
      o: ${VOL_OPS:-SUBFAIL}
  nextcloud_mysql:
    driver: "local"
    driver_opts:
      device: "${VOL_DEVICE_PREFIX_SSD:-SUBFAIL}/containers/nextcloud/mysql"
      type: ${VOL_TYPE:-SUBFAIL}
      o: ${VOL_OPS:-SUBFAIL}
  nextcloud_mariadb:
    driver: "local"
    driver_opts:
      device: "${VOL_DEVICE_PREFIX_SSD:-SUBFAIL}/containers/nextcloud/mariadb"
      type: ${VOL_TYPE:-SUBFAIL}
      o: ${VOL_OPS:-SUBFAIL}

  nextcloud_music:
    driver: "local"
    driver_opts:
      device: "${VOL_DEVICE_PREFIX:-SUBFAIL}/music"
      type: ${VOL_TYPE:-SUBFAIL}
      o: ${VOL_OPS:-SUBFAIL}

  nextcloud_video:
    driver: "local"
    driver_opts:
      device: "${VOL_DEVICE_PREFIX:-SUBFAIL}/video"
      type: ${VOL_TYPE:-SUBFAIL}
      o: ${VOL_OPS:-SUBFAIL}

  nextcloud_camelot:
    driver: "local"
    driver_opts:
      device: "${VOL_DEVICE_PREFIX:-SUBFAIL}/camelot"
      type: ${VOL_TYPE:-SUBFAIL}
      o: ${VOL_OPS:-SUBFAIL}

  nextcloud_scratch:
    driver: "local"
    driver_opts:
      device: "${VOL_DEVICE_PREFIX:-SUBFAIL}/scratch"
      type: ${VOL_TYPE:-SUBFAIL}
      o: ${VOL_OPS:-SUBFAIL}

  nextcloud_books:
    driver: "local"
    driver_opts:
      device: "${VOL_DEVICE_PREFIX:-SUBFAIL}/books"
      type: ${VOL_TYPE:-SUBFAIL}
      o: ${VOL_OPS:-SUBFAIL}

networks:
  reverse-proxy:
    external:
      name: reverse-proxy
  nextcloud_back:
    driver: bridge
  smtp:
    external:
      name: smtp
